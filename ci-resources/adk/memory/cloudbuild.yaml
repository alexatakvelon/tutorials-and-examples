steps:
- id: "adk-memory: prepare tests"
  name: "gcr.io/cloud-builders/gcloud"
  entrypoint: "bash"
  args:
    - '-c'
    - |
      cp -r /workspace/ci-resources/adk/memory/tests /workspace/adk/memory/tests

- id: "adk-memory: validate platform"
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/adk/memory/terraform"
  script: |
    terraform init -no-color
    terraform validate -no-color
  waitFor: ["adk-memory: prepare tests"]

- id: 'adk-memory: create gke cluster'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/adk/memory/terraform"
  env:
  - "KUBE_LOAD_CONFIG_FILE=false"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/adk_memory_gke_cluster_result.txt
    terraform apply \
    -var-file=example.tfvars \
    -var=project_id=$PROJECT_ID \
    -var=cluster_name=ml-adk-memory-$SHORT_SHA-$_BUILD_ID-cluster \
    -var=cluster_location=$_ADK_MEMORY_REGION \
    -var=autopilot_cluster=$_AUTOPILOT_CLUSTER \
    -var=network_name=ml-adk-memory-$SHORT_SHA-$_BUILD_ID \
    -var=subnetwork_name=ml-adk-memory-$SHORT_SHA-$_BUILD_ID \
    -var=subnetwork_region=$_ADK_MEMORY_REGION \
    -var=subnetwork_cidr=10.128.0.0/20 \
    -var=kubernetes_namespace=default \
    -var=image_repository_name=ml-adk-memory-$SHORT_SHA-$_BUILD_ID \
    -var=image_repository_location=$_ADK_MEMORY_REGION \
    -var=cloudsql_instance_name=ml-adk-memory-$SHORT_SHA-$_BUILD_ID \
    -var=cloudsql_instance_region=$_ADK_MEMORY_REGION \
    -auto-approve -no-color
    echo "pass" > /workspace/adk_memory_gke_cluster_result.txt
  allowFailure: true
  waitFor: ['adk-memory: validate platform']

- id: "adk-memory: build adk-agent"
  name: 'gcr.io/cloud-builders/gcloud'
  dir: "/workspace/adk/memory/adk-app"
  args:
  - builds
  - submit
  - --tag
  - ${_ADK_MEMORY_REGION}-docker.pkg.dev/${PROJECT_ID}/ml-adk-memory-${SHORT_SHA}-${_BUILD_ID}/agent-with-memory:latest
  - .
  allowFailure: true
  waitFor: ['adk-memory: create gke cluster']

- id: 'adk-memory: generate kubeconfig'
  name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'container'
  - 'clusters'
  - 'get-credentials'
  - 'ml-adk-memory-${SHORT_SHA}-${_BUILD_ID}-cluster'
  - '--region=${_ADK_MEMORY_REGION}'
  - '--project=${PROJECT_ID}'
  allowFailure: true
  waitFor: ['adk-memory: create gke cluster']

- id: 'adk-memory: create gemini api key secret'
  name: "gcr.io/cloud-builders/kubectl"
  secretEnv: ["GOOGLE_API_KEY"]
  env:
  - "KUBE_LOAD_CONFIG_FILE=false"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    kubectl create secret generic google-api-secret \
      --from-literal=key=$$GOOGLE_API_KEY \
      --dry-run=client -o yaml | kubectl apply -f -
  allowFailure: true
  waitFor: ['adk-memory: generate kubeconfig']

- id: "adk-memory: test guide"
  name: "gcr.io/cloud-builders/kubectl"
  env:
    - "KUBE_LOAD_CONFIG_FILE=false"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e
    echo "fail" > /workspace/adk_memory_test_guide.txt

    # terraform already rendered the deployment manifest (with the correct
    # image tag and Cloud SQL connection info baked in) to gen/agent-with-memory.yaml
    kubectl apply -f /workspace/adk/memory/gen/agent-with-memory.yaml
    kubectl rollout status deployment/adk-agent --timeout=300s
    kubectl port-forward svc/adk-agent 8080:80 &
    sleep 5s

    apt update
    apt install python3-venv --assume-yes
    apt install python3-pip --assume-yes
    pip install requests
    python3 /workspace/adk/memory/tests/test.py http://127.0.0.1:8080

    echo "pass" > /workspace/adk_memory_test_guide.txt
  allowFailure: true
  waitFor: ['adk-memory: create gemini api key secret', 'adk-memory: build adk-agent']

- id: 'adk-memory: cleanup gke cluster'
  name: "gcr.io/${PROJECT_ID}/terraform"
  dir: "/workspace/adk/memory/terraform"
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    set -e

    echo "fail" > /workspace/adk_memory_cleanup_gke_cluster.txt
    terraform destroy \
    -var-file=example.tfvars \
    -var=project_id=$PROJECT_ID \
    -var=cluster_name=ml-adk-memory-$SHORT_SHA-$_BUILD_ID-cluster \
    -var=cluster_location=$_ADK_MEMORY_REGION \
    -var=autopilot_cluster=$_AUTOPILOT_CLUSTER \
    -var=network_name=ml-adk-memory-$SHORT_SHA-$_BUILD_ID \
    -var=subnetwork_name=ml-adk-memory-$SHORT_SHA-$_BUILD_ID \
    -var=subnetwork_region=$_ADK_MEMORY_REGION \
    -var=subnetwork_cidr=10.128.0.0/20 \
    -var=kubernetes_namespace=default \
    -var=image_repository_name=ml-adk-memory-$SHORT_SHA-$_BUILD_ID \
    -var=image_repository_location=$_ADK_MEMORY_REGION \
    -var=cloudsql_instance_name=ml-adk-memory-$SHORT_SHA-$_BUILD_ID \
    -var=cloudsql_instance_region=$_ADK_MEMORY_REGION \
    -auto-approve -no-color
    echo "pass" > /workspace/adk_memory_cleanup_gke_cluster.txt
  allowFailure: true
  waitFor: ['adk-memory: test guide']

- id: 'adk-memory: create github issue'
  name: 'gcr.io/cloud-builders/gcloud'
  secretEnv: ["GH_CLIENT_ID", "GH_PEM"]
  entrypoint: 'bash'
  args:
  - -c
  - |
    apt update
    apt install jq curl python3-venv python3-pip --assume-yes
    pip install PyJWT cryptography

    echo $_GITHUB_ISSUE
    if [[ $_GITHUB_ISSUE != "true" ]]; then
      exit 0
    fi

    if curl -L \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $$GITHUB_TOKEN" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues | jq -e '.[] | select(.labels[] | .name == "adk-memory") | select(.labels[] | .name == "ci/automated-issue")' > /dev/null
    then
      exit 0
    fi

    failed_steps=""

    if [[ $(cat /workspace/adk_memory_gke_cluster_result.txt) != "pass" ]]; then
      failed_steps+="* adk memory gke cluster creation failed\n"
    fi

    if [[ $(cat /workspace/adk_memory_test_guide.txt) != "pass" ]]; then
      failed_steps+="* adk memory test guide failed\n"
    fi

    if [[ $(cat /workspace/adk_memory_cleanup_gke_cluster.txt) != "pass" ]]; then
      failed_steps+="* adk memory gke cluster cleanup failed\n"
    fi

    if [[ -n "$failed_steps" ]]; then
      issue_title="ADK Memory CI/CD Failure: Some steps have failed"
      issue_body="The following steps failed in the Cloud Build pipeline:\n\n$failed_steps"

      payload=$(printf '{"title":"%s","body":"%s","labels":["bug", "adk-memory", "ci/automated-issue"]}' "$issue_title" "$issue_body")

      jwt=$(python3 generate_jwt.py)
      gh_token=$(curl --request POST \
      --url "https://api.github.com/app/installations/90973651/access_tokens" \
      --header "Accept: application/vnd.github+json" \
      --header "Authorization: Bearer $jwt" \
      --header "X-GitHub-Api-Version: 2022-11-28" | jq -r .token)

      curl -L \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $gh_token" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/dmitriy-drogovoz-us/tutorials-and-examples/issues \
        -d "$payload"
    fi
  allowFailure: true
  waitFor: ['adk-memory: cleanup gke cluster']

- id: 'adk-memory: check result'
  name: "ubuntu"
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    echo "pass" > /workspace/check_result.txt

    if [[ $(cat /workspace/adk_memory_gke_cluster_result.txt) != "pass" ]]; then
      echo "adk memory gke cluster creation failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/adk_memory_test_guide.txt) != "pass" ]]; then
      echo "adk memory test guide failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/adk_memory_cleanup_gke_cluster.txt) != "pass" ]]; then
      echo "adk memory gke cluster cleanup failed"
      echo "error" > /workspace/check_result.txt
    fi

    if [[ $(cat /workspace/check_result.txt) != "pass" ]]; then
      cat /workspace/check_result.txt
      exit 1
    fi
  waitFor: ['adk-memory: create github issue']

substitutions:
  _ADK_MEMORY_REGION: us-central1
  _USER_NAME: github
  _AUTOPILOT_CLUSTER: "true"
  _BUILD_ID: ${BUILD_ID:0:8}
  _ITERATION: "0"
logsBucket: gs://ai-on-gke-qss-build-logs
options:
  substitutionOption: "ALLOW_LOOSE"
  machineType: "E2_HIGHCPU_8"
timeout: 5400s
availableSecrets:
  secretManager:
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-client-id/versions/latest
    env: "GH_CLIENT_ID"
  - versionName: projects/ai-on-gke-qss/secrets/tutorials-and-examples-pem/versions/latest
    env: "GH_PEM"
  # NOTE: this secret does not exist yet as of this change and must be created once,
  # out of band, by someone with access to the ai-on-gke-qss GCP project:
  #   echo -n "<a real Gemini Developer API / Google AI Studio key>" | \
  #     gcloud secrets create cloudbuild-gemini-api-key --data-file=- --project=ai-on-gke-qss
  # adk/memory is the only ADK example in this repo whose agent calls the Gemini
  # Developer API directly (via mem0's "gemini" provider) instead of Vertex AI or a
  # self-hosted model, so it's the only pipeline that needs this credential.
  - versionName: projects/ai-on-gke-qss/secrets/cloudbuild-gemini-api-key/versions/latest
    env: "GOOGLE_API_KEY"
